import java.util.Properties

plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def escapeBuildConfigString = { value ->
    if (value == null) return ""
    return value.toString().replace('\\', '\\\\').replace('"', '\\"')
}

def geminiApiKey = escapeBuildConfigString(localProps.getProperty('GEMINI_API_KEY', ''))
def geminiModel = escapeBuildConfigString(localProps.getProperty('GEMINI_MODEL', 'gemini-2.5-flash'))
def enableOnlineAi = localProps.getProperty('ENABLE_ONLINE_AI', geminiApiKey.isEmpty() ? 'false' : 'true')

android {
    namespace 'com.trang.kidsenglishai'
    compileSdk 34

    defaultConfig {
        applicationId "com.trang.kidsenglishai"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "ENABLE_ONLINE_AI", enableOnlineAi
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey}\""
        buildConfigField "String", "GEMINI_MODEL", "\"${geminiModel}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
